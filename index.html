<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment DApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Investment DApp</h1>
        <p>Decentralized Investment & Yield Dashboard</p>
    </header>

    <div class="container">
        <!-- Wallet Connection Card -->
        <div class="card">
            <h2>Wallet Status</h2>
            <button class="btn btn-success" onclick="connectWallet()">Connect Wallet</button>
            <p id="walletAddress" style="margin-top: 0.75rem; font-weight: 500;">Wallet Address: Not Connected</p>

            <div class="stats-grid">
                <div class="stat-box">
                    <label>Wallet Balance</label>
                    <span id="walletBalance">Loading...</span>
                </div>
                <div class="stat-box">
                    <label>Investment Balance</label>
                    <span id="investmentBalance">Loading...</span>
                </div>
                <div class="stat-box">
                    <label>Yield Rate</label>
                    <span id="yieldRate">Loading...</span>
                </div>
            </div>
        </div>

        <!-- User Actions Card -->
        <div class="card">
            <h2>Investment Portal</h2>
            <div class="form-group">
                <label for="amountInput">Deposit Amount (ETH)</label>
                <input type="number" id="amountInput" placeholder="Enter amount in ETH" step="0.01" min="0">
            </div>
            <div>
                <button class="btn" onclick="deposit()">Deposit</button>
                <button class="btn btn-secondary" onclick="startInvestment()">Start Investment</button>
            </div>
        </div>

        <!-- Navigation Links -->
        <div class="nav-bar">
            <button class="btn" onclick="window.location.href='index.html'">Home Page</button>
            <button class="btn btn-secondary" onclick="window.location.href='Admin.html'">Admin Page</button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toastNotification"></div>

    <!-- Web3 & Scripts -->
    <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js@1.0.0-beta.37/dist/web3.min.js"></script>
    <script src="javaa.js"></script>
    <script src="main.js"></script>
</body>
</html>
