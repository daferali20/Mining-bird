<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control - DApp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Admin Control Panel</h1>
        <p>Manage Investments, Approvals, and Withdrawals</p>
    </header>

    <div class="container">
        <!-- Login Form -->
        <div id="loginForm" class="card">
            <h2>Admin Authentication</h2>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button class="btn" onclick="login()">Login</button>
        </div>

        <!-- Admin Controls (hidden by default) -->
        <div id="adminControls" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Control Actions</h2>
                <button class="btn btn-danger" onclick="logout()" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Logout</button>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <button class="btn" onclick="approveWithdrawal()">Approve Withdrawal</button>
                <button class="btn btn-secondary" onclick="withdrawYield()">Withdraw Yield</button>
                <button class="btn btn-secondary" onclick="executeWithdrawal()">Execute Withdrawal</button>
            </div>

            <h2 style="margin-top: 1.5rem;">Owner Withdraw Funds</h2>
            <div class="form-group">
                <label for="withdrawAmount">Amount (ETH)</label>
                <input type="number" id="withdrawAmount" placeholder="Enter amount in ETH" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label for="recipientAddress">Recipient Address</label>
                <input type="text" id="recipientAddress" placeholder="Enter recipient address (0x...)">
            </div>
            <button class="btn btn-success" onclick="withdrawFunds()">Withdraw Funds</button>
        </div>

        <div id="errorDisplay" class="card" style="color: #ef4444; display: none; font-weight: 600;"></div>

        <!-- Navigation Links -->
        <div class="nav-bar">
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">Home Page</button>
            <button class="btn" onclick="window.location.href='Admin.html'">Admin Page</button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toastNotification"></div>

    <!-- Web3 & Scripts -->
    <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js@1.0.0-beta.37/dist/web3.min.js"></script>
    <script src="auth.js"></script>
    <script src="javaa.js"></script>
    <script src="main.js"></script>
</body>
</html>
